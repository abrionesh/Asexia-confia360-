<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#033875" />
      <stop offset="100%" stop-color="#022853" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0080E5" />
      <stop offset="100%" stop-color="#0067B9" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80D518" />
      <stop offset="100%" stop-color="#48A222" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#022853" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded squircle with safe margin -->
  <rect width="512" height="512" rx="112" fill="url(#navyGrad)" />
  
  <!-- Subtle tech pattern accents -->
  <circle cx="96" cy="96" r="4" fill="#0067B9" opacity="0.4" />
  <circle cx="128" cy="96" r="4" fill="#0067B9" opacity="0.4" />
  <circle cx="96" cy="128" r="4" fill="#0067B9" opacity="0.4" />
  
  <!-- Stylized Iconic A -->
  <g transform="translate(40, 30)" filter="url(#shadow)">
    <!-- Left leg of A (Navy-Blue) -->
    <path d="M 120 360 L 216 110 L 276 110 L 180 360 Z" fill="url(#blueGrad)" />
    <!-- Right leg of A (Deep Navy) -->
    <path d="M 240 110 L 300 110 L 396 360 L 336 360 Z" fill="#FFFFFF" opacity="0.95" />
    <!-- The dynamic Swoosh crossbar (Asexia Green to Lime) -->
    <path d="M 90 280 C 160 250, 290 230, 390 205 C 415 198, 380 230, 310 255 C 220 285, 140 295, 90 280 Z" fill="url(#greenGrad)" />
  </g>

  <!-- 360 Badge Ring -->
  <circle cx="396" cy="116" r="44" fill="#0067B9" stroke="#80D518" stroke-width="4" />
  <text x="396" y="123" font-family="'Montserrat', sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">360</text>
</svg>
